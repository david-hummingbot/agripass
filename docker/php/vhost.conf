ServerName localhost

<Directory /var/www/agripass/public>
    AllowOverride None
    Require all granted
    Options -Indexes

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [QSA,L]
</Directory>

<Files "sw.js">
    Header set Cache-Control "no-cache"
</Files>

<VirtualHost *:80>
    DocumentRoot /var/www/agripass/public
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Phone browsers only allow camera access on HTTPS (or localhost), so the scanner needs this listener.
# The entrypoint creates a self-signed certificate; replace the files in storage/certs with a trusted one if needed.
<VirtualHost *:443>
    DocumentRoot /var/www/agripass/public
    SSLEngine on
    SSLCertificateFile /var/www/agripass/storage/certs/agripass.crt
    SSLCertificateKeyFile /var/www/agripass/storage/certs/agripass.key
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
